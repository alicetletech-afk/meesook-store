<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F1E5">
  <title>mesook</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <small>MESOOK</small>
        <h1>mesook <span>♥</span></h1>
      </div>
      <a id="lineTop" class="line-mini" target="_blank" rel="noopener">LINE</a>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="hero-chip">ส่งฟรีที่ล็อบบี้</span>
        <h2 id="heroTitle"></h2>
        <p id="heroDelivery"></p>
        <div class="hero-actions">
          <button id="shopNow" class="primary">เลือกซื้อสินค้า</button>
          <a id="heroLine" class="secondary" target="_blank" rel="noopener">สอบถามเพิ่มเติม</a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="bag">
          <svg viewBox="0 0 64 64"><path d="M18 22h28l-3 30H21L18 22Zm8 0v-5a6 6 0 0 1 12 0v5h-4v-5a2 2 0 0 0-4 0v5h-4Z"/></svg>
        </div>
      </div>
    </section>

    <section class="search-wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13Zm0 1.8a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4Zm5.9 9.62 3.6 3.58-1.28 1.28-3.58-3.6 1.26-1.26Z"/></svg>
        <input id="search" placeholder="ค้นหาสินค้า...">
      </label>
    </section>

    <nav id="categoryNav" class="cats"></nav>

    <section class="section-head" id="productSection">
      <div>
        <small>SHOP</small>
        <h3>ของพร้อมส่ง</h3>
      </div>
      <span id="count"></span>
    </section>

    <section id="products" class="product-grid"></section>

    <section class="lower-cta">
      <div>
        <small>LINE SUPPORT</small>
        <h3 id="helpTitle"></h3>
        <p id="helpBody"></p>
      </div>
      <a id="helpLine" target="_blank" rel="noopener">สอบถามทาง LINE</a>
    </section>
  </main>

  <button id="cartBar" class="cart-bar hidden">
    <span><b id="cartCount">0</b> รายการ</span>
    <span><strong id="cartTotal">฿0</strong> · ดูตะกร้า ›</span>
  </button>

  <div id="optionSheetWrap" class="sheet-wrap hidden">
    <section class="sheet compact">
      <div class="handle"></div>
      <div class="sheet-head">
        <div><small>เลือกสินค้า</small><h3 id="optionTitle"></h3></div>
        <button id="closeOption">×</button>
      </div>
      <div id="optionVariants" class="variant-list"></div>
      <div class="qty-label">จำนวน</div>
      <div class="qty-stepper">
        <button id="optMinus">−</button>
        <strong id="optQty">1</strong>
        <button id="optPlus">+</button>
      </div>
      <div class="summary"><span>รวม</span><strong id="optTotal"></strong></div>
      <button id="confirmAdd" class="checkout">เพิ่มลงตะกร้า</button>
    </section>
  </div>

  <div id="cartSheetWrap" class="sheet-wrap hidden">
    <section class="sheet checkout-sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <div><small>YOUR ORDER</small><h3>ตะกร้าสินค้า</h3></div>
        <button id="closeCart">×</button>
      </div>
      <div id="cartItems"></div>

      <div id="checkoutError" class="checkout-error hidden" role="alert">
  <span class="error-dot">!</span>
  <div>
    <b>กรอกข้อมูลให้ครบก่อนส่งออเดอร์</b>
    <p id="checkoutErrorText"></p>
  </div>
</div>
<div class="form-grid">
        <label>ชื่อผู้สั่ง<input id="name" placeholder="กรอกชื่อ"></label>
        <label>เลขห้อง<input id="room" placeholder="เช่น A1208"></label>
        <label>เบอร์โทร<input id="phone" placeholder="08x-xxx-xxxx"></label>
        <label>เวลารับของ<input id="pickupTime" placeholder="เช่น 19:00"></label>
      </div>

      <label>จุดรับสินค้า
        <select id="deliveryType">
          <option value="lobby">ล็อบบี้ IDEO MOBI EASTGATE</option>
          <option value="nearby">พื้นที่ใกล้เคียง</option>
        </select>
      </label>

      <label id="nearbyWrap" class="hidden">ระบุสถานที่<input id="nearbyLocation"></label>
      <label>หมายเหตุ<textarea id="note" rows="3"></textarea></label>

      <div class="checkout-actions">
        <div class="summary"><span>ยอดรวม</span><strong id="sheetTotal"></strong></div>
        <button id="orderLine" class="checkout">ส่งออเดอร์</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>

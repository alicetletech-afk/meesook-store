<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F1E6">
  <title>มีสุขส่งถึง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <small>MEE SOOK SONG THUENG</small>
        <h1>มีสุขส่งถึง 💛</h1>
      </div>
      <a class="line-btn" href="https://line.me/R/ti/p/@435ktnsf" target="_blank">LINE</a>
    </header>

    <section class="hero">
      <div>
        <span class="badge">🚚 ส่งฟรีที่ล็อบบี้</span>
        <h2>ของกิน ของใช้<br>ส่งถึงง่ายๆ</h2>
        <p>เลือกสินค้าแล้วส่งออเดอร์เข้า LINE ได้เลย</p>
      </div>
      <div class="hero-emoji">🛍️</div>
    </section>

    <label class="search">
      <span>⌕</span>
      <input id="search" placeholder="ค้นหาสินค้า...">
    </label>

    <div class="cats" id="cats">
      <button class="active" data-cat="all">ทั้งหมด</button>
      <button data-cat="water">💧 น้ำดื่ม</button>
      <button data-cat="rice">🍚 ข้าวสาร</button>
      <button data-cat="noodle">🍜 มาม่า</button>
      <button data-cat="other">🧺 อื่นๆ</button>
    </div>

    <div class="section-title">
      <div><small>SHOP</small><h3>ของพร้อมส่ง</h3></div>
      <span id="count"></span>
    </div>

    <section id="products" class="grid"></section>
  </main>

  <button id="cartBar" class="cart-bar hidden">
    <span>🛒 <b id="cartCount">0</b> รายการ</span>
    <span><b id="cartTotal">฿0</b> · ดูตะกร้า ›</span>
  </button>

  <div id="sheetWrap" class="sheet-wrap hidden">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <div><small>YOUR ORDER</small><h3>ตะกร้าของฉัน</h3></div>
        <button id="closeSheet" class="close">×</button>
      </div>

      <div id="cartItems"></div>

      <div class="customer-form">
        <div class="two">
          <label>ชื่อ<input id="name" placeholder="ชื่อผู้สั่ง"></label>
          <label>ห้อง<input id="room" placeholder="เช่น A1208"></label>
        </div>
        <label>เบอร์โทร<input id="phone" inputmode="tel" placeholder="08x-xxx-xxxx"></label>
        <label>หมายเหตุ<textarea id="note" rows="2" placeholder="เช่น ขอรับประมาณ 19:00 น."></textarea></label>
      </div>

      <div class="summary">
        <span>ยอดรวม</span><strong id="sheetTotal">฿0</strong>
      </div>

      <button id="orderLine" class="primary">ส่งออเดอร์ผ่าน LINE</button>
      <p class="hint">ระบบจะเตรียมข้อความออเดอร์ให้ แล้วเปิดแชท LINE @435ktnsf อัตโนมัติ</p>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
